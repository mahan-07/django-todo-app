{% load static %}
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'img/icon.svg' %}" type="image/svg+xml">
    <title>{% block title %}{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/indexStyle.css' %}">
    <link rel="stylesheet" href="{% static 'css/formStyle.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: #5a0080;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;

            position: fixed;
            top: 0;
            width: 100%;
        }

        .logo {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration:none;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .nav-menu a:hover {
            color: #244cdc;
            
            transition-delay: 0.025s;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-menu {
                display: none;
                width: 100%;
                flex-direction: column;
                text-align: center;
                gap: 1rem;
                margin-top: 1rem;
            }

            .nav-menu.active {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">ToDo</a>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-menu" id="nav-menu">
            {% if user.is_authenticated %}
            <li><a href="#">About Us</a></li>
            <li><a href="{% url 'history' %}">History</a></li>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url "account_data" %}"><img width="40px" height="auto" src="{% static 'img/user2.svg' %}" alt="User"></a></li>
            {% else %}
            <li><a href="{% url "signup" %}">Login/Signup</a></li>
            {% endif %}
        </ul>
    </nav>

    <!-- محتوای صفحه -->
    
    <div >
    {% block content %}{% endblock content %}
    </div>



    <script>
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');

        hamburger.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });
    </script>
    
    {% block scripts %}{% endblock %}

</body>
</html>
